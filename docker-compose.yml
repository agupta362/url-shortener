services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - backend-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend-network

  # Fake AWS (SQS/SNS) — free local stand-in for real AWS messaging
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: us-east-1
    networks:
      - backend-network

  api:
    build: .
    ports:
      - "8002:8000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_CLICKS_QUEUE_NAME: url-shortener-clicks
      SQS_CLICKS_LOG_QUEUE_NAME: url-shortener-clicks-log
      SNS_CLICKS_TOPIC_NAME: url-shortener-clicks
    networks:
      - backend-network

  # Same image as API, different command pulls clicks from SQS to Postgres
  worker:
    build: .
    command: ["python", "worker.py"]
    depends_on:
      - api
    env_file:
      - .env
    environment:
      DB_HOST: db
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_CLICKS_QUEUE_NAME: url-shortener-clicks
      SQS_CLICKS_LOG_QUEUE_NAME: url-shortener-clicks-log
      SNS_CLICKS_TOPIC_NAME: url-shortener-clicks
    networks:
      - backend-network

  # Second SNS subscriber
  logger-worker:
    build: .
    command: ["python", "logger_worker.py"]
    depends_on:
      - api
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_CLICKS_QUEUE_NAME: url-shortener-clicks
      SQS_CLICKS_LOG_QUEUE_NAME: url-shortener-clicks-log
      SNS_CLICKS_TOPIC_NAME: url-shortener-clicks
    networks:
      - backend-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  postgres-data:
