# On EC2 we use real SNS/SQS (from Terraform) + the instance IAM role.
# No LocalStack, no fake access keys.
# DB_HOST comes from .env (RDS endpoint written by user_data).
services:
  localstack:
    profiles: ["local-only"]

  db:
    profiles: ["local-only"]

  api:
    environment:
      DB_HOST: ${DB_HOST}
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}

  worker:
    environment:
      DB_HOST: ${DB_HOST}
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}

  logger-worker:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
