# On EC2 we use real SNS/SQS (from Terraform) + the instance IAM role.
# No LocalStack, no fake access keys.
# Note: Compose merges depends_on as a set — do not list localstack
# as a hard dependency in docker-compose.yml (see api/worker there).
services:
  localstack:
    profiles: ["local-only"]

  api:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}

  worker:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}

  logger-worker:
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_ENDPOINT_URL: ""
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
