server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # App API calls: /api/* -> FastAPI (prefix stripped). ^~ so the
    # short-code regex below never steals these paths.
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Clean short links: a single root segment with no dot (e.g. /gh, /py)
    # is treated as a short code and sent to FastAPI's /{short_code}.
    location ~ "^/[A-Za-z0-9_-]+$" {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA: real files (index.html, /assets/*, *.svg) first, else app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
